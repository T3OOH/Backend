name: Manter API acordada

# O plano gratuito do Render desliga o serviço após 15 min sem acesso e a primeira visita
# espera ele religar. Este ping a cada 10 min mantém a API e o cache de painéis prontos.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Health e painéis
        run: |
          curl -fsS --max-time 90 -o /dev/null -w "health %{http_code} %{time_total}s\n" https://backend-2go8.onrender.com/health
          curl -fsS --max-time 60 -o /dev/null -w "panels %{http_code} %{time_total}s\n" https://backend-2go8.onrender.com/panels
